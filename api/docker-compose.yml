name: workspace

x-reverb-env: &reverb-internal
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http

services:
  api:
    build:
      context: ./docker/php
    image: workspace-php
    container_name: workspace_api
    volumes:
      - ./:/var/www/api
    ports:
      - "8003:8080"
    environment: *reverb-internal
    depends_on:
      postgres:
        condition: service_healthy

  reverb:
    image: workspace-php
    container_name: workspace_reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - ./:/var/www/api
    ports:
      - "8086:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  queue:
    image: workspace-php
    container_name: workspace_queue
    command: ["php", "artisan", "queue:work", "--tries=3"]
    volumes:
      - ./:/var/www/api
    environment: *reverb-internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      reverb:
        condition: service_started

  scheduler:
    image: workspace-php
    container_name: workspace_scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/api
    environment: *reverb-internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: workspace_postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - workspace_pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workspace_pgdata:
