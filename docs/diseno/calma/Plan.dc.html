<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plan del proyecto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F4F6}
a{color:#3A3DB8}a:hover{color:#2B2E91}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; background: #F3F4F6; color: #15171C; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<nav aria-label="Navegación principal (contraída)" style="flex: 0 0 56px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 10px">
  <button type="button" aria-label="Organización: Equipo Posven" style="width: 40px; height: 40px; border: 0; border-radius: 11px; background: #15171C; color: #FFFFFF; font-weight: 700; font-size: 12px; cursor: pointer">EP</button>
  <span style="width: 24px; height: 1px; background: #E0E2E7; margin: 4px 0"></span>
  <a href="Projects.dc.html" aria-label="Inicio" style="width: 40px; height: 40px; border-radius: 10px; color: #4A5160; display: grid; place-items: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
  </a>
  <a href="#menciones" aria-label="Menciones, 2 sin leer" style="position: relative; width: 40px; height: 40px; border-radius: 10px; color: #4A5160; display: grid; place-items: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"></path></svg>
    <span style="position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 999px; background: #4B4FD8; border: 2px solid #F3F4F6"></span>
  </a>
  <a href="Logs.dc.html" aria-label="Avisos abiertos, 5" style="position: relative; width: 40px; height: 40px; border-radius: 10px; color: #4A5160; display: grid; place-items: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
    <span style="position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 999px; background: #E8613C; border: 2px solid #F3F4F6"></span>
  </a>
  <span style="width: 24px; height: 1px; background: #E0E2E7; margin: 4px 0"></span>
  <a href="Main.dc.html" aria-label="posveapi" aria-current="page" style="width: 40px; height: 40px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 1px #E5E7EB; color: #3A3DB8; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; text-decoration: none">PO</a>
  <a href="#web" aria-label="workspace-web" style="width: 40px; height: 40px; border-radius: 10px; color: #4A5160; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; text-decoration: none">WE</a>
  <a href="#medic" aria-label="medic" style="width: 40px; height: 40px; border-radius: 10px; color: #4A5160; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; text-decoration: none">ME</a>
  <div style="flex-grow: 1"></div>
  <span aria-label="Sergio" style="width: 34px; height: 34px; border-radius: 999px; background: #DCD9FB; color: #2B2E91; display: grid; place-items: center; font-weight: 600; font-size: 12px">SC</span>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; overflow: hidden">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 20px; border-bottom: 1px solid #EDEEF1">
    <div style="display: flex; align-items: center; gap: 10px; flex: 1 1 260px; min-width: 0">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; padding: 3px 6px; border-radius: 6px; background: #EEEEFD; color: #3A3DB8">POSVE</span>
      <h1 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em">posveapi</h1>
      <span style="color: #626976; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">API de ventas y facturación</span>
    </div>
    <nav aria-label="Vistas del proyecto" style="display: flex; gap: 2px; padding: 3px; background: #F3F4F6; border-radius: 10px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 8px; color: #4A5160; text-decoration: none; font-weight: 500">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        Canal
      </a>
      <a href="Logs.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 8px; color: #4A5160; text-decoration: none; font-weight: 500">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        Log
        <span style="font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: #FFF0EA; color: #B93815">4</span>
      </a>
      <a href="Plan.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(21,23,28,0.08); color: #15171C; text-decoration: none; font-weight: 600">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 7v7M12 7v4M16 7v9"></path></svg>
        Plan
      </a>
    </nav>
    <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 0; background: #15171C; color: #FFFFFF; border-radius: 9px; cursor: pointer; font-weight: 500">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Nueva tarea
    </button>
  </header>

  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 20px 0">
    <button type="button" aria-pressed="true" style="min-height: 32px; padding: 0 12px; border: 1px solid #C9CAF5; border-radius: 999px; background: #EEEEFD; color: #3A3DB8; font-weight: 600; font-size: 13px; cursor: pointer">Todas</button>
    <button type="button" aria-pressed="false" style="min-height: 32px; padding: 0 12px; border: 1px solid #E5E7EB; border-radius: 999px; background: #FFFFFF; color: #4A5160; font-weight: 500; font-size: 13px; cursor: pointer">Mías</button>
    <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border: 1px solid #E5E7EB; border-radius: 999px; background: #FFFFFF; color: #4A5160; font-weight: 500; font-size: 13px; cursor: pointer">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
      Desde avisos
    </button>
  </div>

  <div style="flex: 1; overflow-x: auto; padding: 14px 20px 20px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; min-height: 100%; align-items: start">
      <sc-for list="{{ columns }}" as="col" hint-placeholder-count="4">
        <section style="display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: 12px; background: #F7F8FA">
          <div style="display: flex; align-items: center; gap: 8px; padding: 2px 4px">
            <span style="width: 8px; height: 8px; border-radius: 999px; background: {{ col.dot }}"></span>
            <h2 style="margin: 0; font-size: 13.5px; font-weight: 600">{{ col.name }}</h2>
            <span style="font-size: 12.5px; color: #626976">{{ col.count }}</span>
          </div>
          <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="2">
            <article style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid {{ c.border }}; box-shadow: {{ c.shadow }}">
              <sc-if value="{{ c.fromNotice }}" hint-placeholder-val="{{ false }}">
                <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 6px; border-radius: 999px; background: {{ c.noticeBg }}; color: {{ c.noticeFg }}; font-size: 11.5px; font-weight: 600">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                  {{ c.notice }}
                </span>
              </sc-if>
              <p style="margin: 0; font-weight: 500; line-height: 1.4">{{ c.title }}</p>
              <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #626976">
                <span style="font-family: 'JetBrains Mono', monospace">{{ c.id }}</span>
                <span style="flex: 1"></span>
                <sc-if value="{{ c.comments }}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 4px">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    {{ c.comments }}
                  </span>
                </sc-if>
                <span style="width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: {{ c.avatarBg }}; color: {{ c.avatarFg }}">{{ c.who }}</span>
              </div>
            </article>
          </sc-for>
          <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #626976; cursor: pointer; font-size: 13px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            Agregar tarea
          </button>
        </section>
      </sc-for>
    </div>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var people = {
      SC: { avatarBg: '#DCD9FB', avatarFg: '#2B2E91' },
      CR: { avatarBg: '#FCE3D3', avatarFg: '#93370D' },
      DM: { avatarBg: '#D3F0E3', avatarFg: '#05603A' }
    };
    function card(o) {
      var p = people[o.who];
      return {
        id: o.id, title: o.title, who: o.who, comments: o.comments || '',
        avatarBg: p.avatarBg, avatarFg: p.avatarFg,
        fromNotice: !!o.notice, notice: o.notice || '',
        noticeBg: o.lv === 'critical' ? '#B42318' : o.lv === 'warning' ? '#FEF6E0' : '#FFF0EA',
        noticeFg: o.lv === 'critical' ? '#FFFFFF' : o.lv === 'warning' ? '#8A5A06' : '#B93815',
        border: o.fresh ? '#C9CAF5' : '#E5E7EB',
        shadow: o.fresh ? '0 0 0 3px #EEEEFD' : '0 1px 2px rgba(21,23,28,0.04)'
      };
    }
    return {
      columns: [
        { name: 'Por hacer', dot: '#A3A8B3', count: 3, cards: [
          card({ id: 'POSVE-14', title: 'Revisar el failover de Redis en el worker', who: 'SC', notice: 'Crítico · 214 eventos', lv: 'critical', fresh: true }),
          card({ id: 'POSVE-11', title: 'Índice en invoices.customer_id para la consulta lenta', who: 'DM', notice: 'Advertencia · 1.204 eventos', lv: 'warning' }),
          card({ id: 'POSVE-09', title: 'Exportar facturas del mes en CSV', who: 'CR' })
        ] },
        { name: 'En curso', dot: '#4B4FD8', count: 2, cards: [
          card({ id: 'POSVE-12', title: 'Evitar número de orden duplicado al reintentar la cola', who: 'CR', notice: 'Error · 37 eventos', lv: 'error', comments: 4 }),
          card({ id: 'POSVE-10', title: 'Validar firma del webhook de Stripe', who: 'DM', comments: 1 })
        ] },
        { name: 'En revisión', dot: '#E9A23B', count: 1, cards: [
          card({ id: 'POSVE-08', title: 'Fix del cálculo de IVA en notas de crédito', who: 'DM', comments: 6 })
        ] },
        { name: 'Hecho', dot: '#12B76A', count: 2, cards: [
          card({ id: 'POSVE-07', title: 'Timeout en webhook de pagos', who: 'CR', notice: 'Desde aviso · resuelto', lv: 'error' }),
          card({ id: 'POSVE-05', title: 'Paginación por cursor en órdenes', who: 'SC' })
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
